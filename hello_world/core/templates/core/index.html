<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Home</title>
</head>
<body>
  <h1>Welcome</h1>

  {% if user.is_authenticated %}
    <p>Signed in as {{ user.username }} — <a href="{% url 'accounts-logout' %}">Log out</a></p>
  {% else %}
    <p>
      <a href="{% url 'accounts-register' %}">Register</a> |
      <a href="{% url 'accounts-login' %}">Log in</a>
    </p>
  {% endif %}

  <p>
    Affiliate registration: <a href="{% url 'affiliates-register' %}">/register/</a>
  </p>

  <p>
    Payments: <a href="{% url 'payments-index' %}">Payments home</a>
  </p>
</body>
</html>
