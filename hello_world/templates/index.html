{% load django_browser_reload %}
{% load static %}

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Home</title>
</head>
<body>
  <h1>Welcome to affiliate marketing Gurus</h1>

  {% if user.is_authenticated %}
    <p>Signed in as {{ user.username }} — <a href="{% url 'accounts-logout' %}">Log out</a></p>
  {% else %}
    <p>
      <a href="{% url 'accounts-register' %}">Register</a> |
      <a href="{% url 'accounts-login' %}">Log in</a>
    </p>
  {% endif %}

</body>
</html>
